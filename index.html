<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AgroForte Sustentável</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700;900&family=DM+Sans:wght@300;400;500;600&family=Satisfy&display=swap">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --green-deep:   #1b4332;
      --green-mid:    #2d6a4f;
      --green-light:  #52b788;
      --green-pale:   #b7e4c7;
      --gold:         #d4a017;
      --gold-light:   #f0c040;
      --earth:        #6b4226;
      --earth-light:  #a0724a;
      --cream:        #faf6ef;
      --cream-dark:   #f0e8d8;
      --text-dark:    #1a1a0e;
      --text-mid:     #3d3d2e;
      --text-light:   #7a7a5e;
      --white:        #ffffff;
      --shadow:       0 4px 24px rgba(27,67,50,0.13);
      --shadow-lg:    0 8px 40px rgba(27,67,50,0.18);
      --radius:       16px;
      --radius-sm:    8px;
    }
    html, body, #root { height: 100%; font-family: 'DM Sans', sans-serif; background: var(--cream); color: var(--text-dark); }
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: var(--cream-dark); }
    ::-webkit-scrollbar-thumb { background: var(--green-mid); border-radius: 3px; }
    button { font-family: 'DM Sans', sans-serif; cursor: pointer; border: none; outline: none; }
    input, textarea, select { font-family: 'DM Sans', sans-serif; outline: none; }
    @keyframes fadeIn { from { opacity:0; transform:translateY(16px); } to { opacity:1; transform:translateY(0); } }
    @keyframes slideIn { from { opacity:0; transform:translateX(-24px); } to { opacity:1; transform:translateX(0); } }
    @keyframes pulse { 0%,100% { opacity:1; } 50% { opacity:0.5; } }
    @keyframes float { 0%,100% { transform:translateY(0); } 50% { transform:translateY(-8px); } }
    @keyframes spin { from { transform:rotate(0deg); } to { transform:rotate(360deg); } }
    .fade-in { animation: fadeIn 0.5s ease both; }
    .slide-in { animation: slideIn 0.4s ease both; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useEffect, useRef, useCallback } = React;

    const initialUsers = [
      { id: 1, name: "João Silva", email: "joao@fazenda.com", password: "123456", role: "Agricultor", avatar: "🧑‍🌾" },
    ];

    const Icon = ({ name, size = 20, color = "currentColor" }) => {
      const icons = {
        leaf: <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.48 19 2c1 2 2 4.18 2 8 0 5.5-4.78 10-10 10z"/><path d="M2 21c0-3 1.85-5.36 5.08-6C9.5 14.52 12 13 13 12"/></svg>,
        tractor: <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M3 4h9l1 7"/><path d="M4 11V4"/><circle cx="7" cy="15" r="4"/><circle cx="17" cy="17" r="2"/><path d="M13 11h5l2 4"/><path d="M14 11V6l3 5"/></svg>,
        droplet: <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M12 2.69l5.66 5.66a8 8 0 1 1-11.31 0z"/></svg>,
        sun: <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>,
        layers: <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polygon points="12 2 2 7 12 12 22 7 12 2"/><polyline points="2 17 12 22 22 17"/><polyline points="2 12 12 17 22 12"/></svg>,
        bot: <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="3" y="11" width="18" height="10" rx="2"/><circle cx="12" cy="5" r="2"/><path d="M12 7v4"/><line x1="8" y1="16" x2="8" y2="16"/><line x1="16" y1="16" x2="16" y2="16"/></svg>,
        mapPin: <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>,
        user: <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>,
        home: <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>,
        logout: <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>,
        send: <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>,
        check: <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="20 6 9 17 4 12"/></svg>,
        alert: <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>,
        wind: <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M9.59 4.59A2 2 0 1 1 11 8H2m10.59 11.41A2 2 0 1 0 14 16H2m15.73-8.27A2.5 2.5 0 1 1 19.5 12H2"/></svg>,
        zap: <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>,
        search: <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>,
        menu: <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg>,
        close: <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>,
        edit: <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>,
        star: <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>,
        recycle: <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="1.5 8.5 1.5 3.5 6.5 3.5"/><path d="M2 3.5C5 2 8 1.5 12 1.5a10 10 0 0 1 10 10c0 2-.5 4-1.5 5.5"/><polyline points="22.5 15.5 22.5 20.5 17.5 20.5"/><path d="M22 20.5C19 22 16 22.5 12 22.5a10 10 0 0 1-10-10c0-2 .5-4 1.5-5.5"/></svg>,
        cow: <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M18 8h1a4 4 0 0 1 0 8h-1"/><path d="M2 8h16v9a4 4 0 0 1-4 4H6a4 4 0 0 1-4-4V8z"/><line x1="6" y1="1" x2="6" y2="4"/><line x1="10" y1="1" x2="10" y2="4"/></svg>,
      };
      return icons[name] || null;
    };

    const FARM_SYSTEM_PROMPT = `Você é AgroBot, um assistente especializado em agricultura, pecuária e sustentabilidade rural para o Brasil. Você tem conhecimento profundo sobre:

AGRICULTURA: Culturas (soja, milho, cana, café, algodão, frutas, hortaliças), manejo do solo, adubação, irrigação, defensivos, sementes, colheita, armazenagem, mercado agrícola.

PECUÁRIA: Bovinos (corte e leite), suínos, aves, ovinos, caprinos, equinos. Nutrição animal, sanidade, reprodução, genética, manejo de pastagens, confinamento, bem-estar animal.

SUSTENTABILIDADE: Energia solar rural, biodigestores, compostagem, aproveitamento de resíduos, reflorestamento, APPs e Reserva Legal, agricultura orgânica, certificações, crédito de carbono.

SOLO E ÁGUA: Análise de solo, calagem, gessagem, conservação do solo, terraceamento, irrigação eficiente, captação de água da chuva, outorga de uso da água, qualidade da água.

ENERGIA RURAL: Energia solar fotovoltaica (custo, viabilidade, incentivos), bioenergia, biogás, mini-PCHs, ANEEL, tarifas rurais, financiamentos (Pronaf, Pronamp).

LEGISLAÇÃO: CAR, PRA, Código Florestal, licenciamento ambiental, ITR, contratos rurais, arrendamento, parcerias.

FINANCIAMENTOS: Pronaf, Pronamp, ABC (Agricultura de Baixo Carbono), FCO Rural, FNE Rural, Plano Safra, seguros rurais (Proagro, PSR).

MERCADO: Preços de commodities, exportações, cooperativas, tradings, armazéns gerais, CPR (Cédula de Produto Rural).

TECNOLOGIA RURAL: Agricultura de precisão, drones, sensoriamento remoto, IoT na fazenda, software de gestão, aplicativos rurais.

Responda sempre em português do Brasil, com linguagem clara e prática. Use emojis ocasionalmente para tornar as respostas mais amigáveis. Dê respostas completas e úteis. Se o usuário perguntar sobre sua fazenda especificamente, use as informações que ele já cadastrou no sistema para personalizar suas respostas. Seja direto, prático e empático com o agricultor.`;

    async function askAgroBot(messages) {
      const response = await fetch("https://api.anthropic.com/v1/messages", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          model: "claude-sonnet-4-20250514",
          max_tokens: 1000,
          system: FARM_SYSTEM_PROMPT,
          messages,
        }),
      });
      const data = await response.json();
      return data.content?.[0]?.text || "Desculpe, não consegui processar sua pergunta agora.";
    }

    async function searchSustainableProviders(location, type) {
      const prompt = `O agricultor está buscando fornecedores/empresas de ${type} sustentável na região de: ${location}, Brasil.\n\nListe de forma organizada:\n1. Principais empresas/fornecedores que atuam nessa região (ou no estado/região próxima)\n2. Programas governamentais disponíveis\n3. Cooperativas ou associações relevantes\n4. Dicas para contratar e financiar\n\nSeja específico para a região brasileira mencionada. Use o formato com emojis e seja prático.`;
      const response = await fetch("https://api.anthropic.com/v1/messages", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          model: "claude-sonnet-4-20250514",
          max_tokens: 1000,
          system: FARM_SYSTEM_PROMPT,
          messages: [{ role: "user", content: prompt }],
        }),
      });
      const data = await response.json();
      return data.content?.[0]?.text || "Não foi possível buscar fornecedores agora.";
    }

    const Logo = ({ size = "md" }) => (
      <div style={{ display: "flex", alignItems: "center", gap: size === "lg" ? 14 : 10 }}>
        <div style={{ width: size === "lg" ? 52 : 38, height: size === "lg" ? 52 : 38, borderRadius: "50%", background: "linear-gradient(135deg, var(--green-mid), var(--green-light))", display: "flex", alignItems: "center", justifyContent: "center", boxShadow: "0 4px 12px rgba(45,106,79,0.35)", flexShrink: 0 }}>
          <Icon name="leaf" size={size === "lg" ? 28 : 20} color="#fff" />
        </div>
        <div>
          <div style={{ fontFamily: "'Playfair Display', serif", fontWeight: 700, fontSize: size === "lg" ? 22 : 16, color: "var(--green-deep)", lineHeight: 1.1 }}>AgroForte</div>
          <div style={{ fontFamily: "'DM Sans', sans-serif", fontWeight: 400, fontSize: size === "lg" ? 11 : 9, color: "var(--green-light)", letterSpacing: "0.12em", textTransform: "uppercase" }}>Forte & Sustentável</div>
        </div>
      </div>
    );

    const Btn = ({ children, variant = "primary", onClick, style = {}, disabled = false, size = "md" }) => {
      const variants = {
        primary: { background: "linear-gradient(135deg, var(--green-mid), var(--green-deep))", color: "#fff", border: "none" },
        secondary: { background: "transparent", color: "var(--green-mid)", border: "2px solid var(--green-mid)" },
        gold: { background: "linear-gradient(135deg, var(--gold), #b8860b)", color: "#fff", border: "none" },
        danger: { background: "linear-gradient(135deg, #e74c3c, #c0392b)", color: "#fff", border: "none" },
        ghost: { background: "rgba(27,67,50,0.08)", color: "var(--green-deep)", border: "none" },
      };
      const sizes = { sm: { padding: "8px 16px", fontSize: 13 }, md: { padding: "12px 24px", fontSize: 15 }, lg: { padding: "16px 36px", fontSize: 17 } };
      return (
        <button onClick={onClick} disabled={disabled} style={{ ...variants[variant], ...sizes[size], borderRadius: 12, fontWeight: 600, cursor: disabled ? "not-allowed" : "pointer", opacity: disabled ? 0.6 : 1, transition: "all 0.2s", display: "inline-flex", alignItems: "center", gap: 8, ...style }}
          onMouseEnter={e => { if (!disabled) { e.currentTarget.style.transform = "translateY(-2px)"; e.currentTarget.style.boxShadow = "0 6px 20px rgba(27,67,50,0.25)"; } }}
          onMouseLeave={e => { e.currentTarget.style.transform = ""; e.currentTarget.style.boxShadow = ""; }}>
          {children}
        </button>
      );
    };

    const Input = ({ label, value, onChange, type = "text", placeholder, icon, required }) => (
      <div style={{ marginBottom: 16 }}>
        {label && <label style={{ display: "block", fontWeight: 600, fontSize: 13, color: "var(--text-mid)", marginBottom: 6 }}>{label}{required && <span style={{ color: "var(--gold)" }}> *</span>}</label>}
        <div style={{ position: "relative" }}>
          {icon && <div style={{ position: "absolute", left: 14, top: "50%", transform: "translateY(-50%)", color: "var(--green-mid)", pointerEvents: "none" }}><Icon name={icon} size={18} /></div>}
          <input type={type} value={value} onChange={e => onChange(e.target.value)} placeholder={placeholder} required={required}
            style={{ width: "100%", padding: icon ? "13px 16px 13px 44px" : "13px 16px", border: "2px solid var(--cream-dark)", borderRadius: 10, fontSize: 15, background: "#fff", color: "var(--text-dark)", transition: "border-color 0.2s" }}
            onFocus={e => e.target.style.borderColor = "var(--green-light)"}
            onBlur={e => e.target.style.borderColor = "var(--cream-dark)"} />
        </div>
      </div>
    );

    const Select = ({ label, value, onChange, options, required }) => (
      <div style={{ marginBottom: 16 }}>
        {label && <label style={{ display: "block", fontWeight: 600, fontSize: 13, color: "var(--text-mid)", marginBottom: 6 }}>{label}{required && <span style={{ color: "var(--gold)" }}> *</span>}</label>}
        <select value={value} onChange={e => onChange(e.target.value)}
          style={{ width: "100%", padding: "13px 16px", border: "2px solid var(--cream-dark)", borderRadius: 10, fontSize: 15, background: "#fff", color: "var(--text-dark)", cursor: "pointer", appearance: "none" }}
          onFocus={e => e.target.style.borderColor = "var(--green-light)"}
          onBlur={e => e.target.style.borderColor = "var(--cream-dark)"}>
          {options.map(o => <option key={o.value} value={o.value}>{o.label}</option>)}
        </select>
      </div>
    );

    const Card = ({ children, style = {}, className = "" }) => (
      <div className={className} style={{ background: "#fff", borderRadius: "var(--radius)", boxShadow: "var(--shadow)", padding: 24, ...style }}>{children}</div>
    );

    const StatCard = ({ icon, label, value, unit, color, trend }) => (
      <Card style={{ padding: "20px 24px" }}>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start" }}>
          <div style={{ width: 48, height: 48, borderRadius: 12, background: color + "22", display: "flex", alignItems: "center", justifyContent: "center" }}>
            <Icon name={icon} size={24} color={color} />
          </div>
          {trend && <span style={{ fontSize: 12, fontWeight: 600, padding: "4px 8px", borderRadius: 20, background: trend > 0 ? "#d4edda" : "#fde8e8", color: trend > 0 ? "#2d6a4f" : "#c0392b" }}>{trend > 0 ? "↑" : "↓"} {Math.abs(trend)}%</span>}
        </div>
        <div style={{ marginTop: 16 }}>
          <div style={{ fontSize: 28, fontWeight: 700, color: "var(--text-dark)", fontFamily: "'Playfair Display', serif" }}>{value} <span style={{ fontSize: 14, fontWeight: 400, color: "var(--text-light)" }}>{unit}</span></div>
          <div style={{ fontSize: 13, color: "var(--text-light)", marginTop: 4 }}>{label}</div>
        </div>
      </Card>
    );

    const LoginPage = ({ onLogin, onRegister }) => {
      const [email, setEmail] = useState("");
      const [password, setPassword] = useState("");
      const [error, setError] = useState("");
      const [loading, setLoading] = useState(false);

      const handleLogin = () => {
        setLoading(true); setError("");
        setTimeout(() => {
          const user = initialUsers.find(u => u.email === email && u.password === password);
          if (user) onLogin(user);
          else setError("E-mail ou senha incorretos. Use: joao@fazenda.com / 123456");
          setLoading(false);
        }, 800);
      };

      return (
        <div style={{ minHeight: "100vh", display: "flex", background: "linear-gradient(135deg, var(--green-deep) 0%, var(--green-mid) 50%, #40916c 100%)", position: "relative", overflow: "hidden" }}>
          <div style={{ position: "absolute", inset: 0, overflow: "hidden", pointerEvents: "none" }}>
            {[...Array(6)].map((_, i) => (
              <div key={i} style={{ position: "absolute", width: 300 + i * 80, height: 300 + i * 80, borderRadius: "50%", border: "1px solid rgba(255,255,255,0.06)", top: "50%", left: "50%", transform: "translate(-50%, -50%)", animation: `float ${3 + i}s ease-in-out infinite` }} />
            ))}
          </div>
          <div style={{ flex: 1, display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", padding: 48, color: "#fff", position: "relative" }} className="fade-in">
            <div style={{ marginBottom: 32, animation: "float 4s ease-in-out infinite" }}><div style={{ fontSize: 80 }}>🌱</div></div>
            <h1 style={{ fontFamily: "'Playfair Display', serif", fontSize: 42, fontWeight: 900, textAlign: "center", lineHeight: 1.2, marginBottom: 16 }}>AgroForte<br /><span style={{ color: "var(--gold-light)" }}>Sustentável</span></h1>
            <p style={{ fontSize: 17, opacity: 0.85, textAlign: "center", maxWidth: 380, lineHeight: 1.7 }}>Gestão inteligente da sua propriedade rural com tecnologia e sustentabilidade no campo.</p>
            <div style={{ display: "flex", gap: 24, marginTop: 40, flexWrap: "wrap", justifyContent: "center" }}>
              {[["🌾", "Agricultura"], ["🐄", "Pecuária"], ["☀️", "Energia Solar"], ["💧", "Recursos Hídricos"]].map(([emoji, label]) => (
                <div key={label} style={{ textAlign: "center", background: "rgba(255,255,255,0.1)", backdropFilter: "blur(8px)", borderRadius: 12, padding: "12px 16px", minWidth: 90 }}>
                  <div style={{ fontSize: 24, marginBottom: 4 }}>{emoji}</div>
                  <div style={{ fontSize: 11, opacity: 0.85, fontWeight: 600 }}>{label}</div>
                </div>
              ))}
            </div>
          </div>
          <div style={{ width: "100%", maxWidth: 480, background: "var(--cream)", display: "flex", flexDirection: "column", justifyContent: "center", padding: "48px 40px", borderRadius: "32px 0 0 32px" }} className="slide-in">
            <div style={{ marginBottom: 36 }}><Logo size="lg" /></div>

      const messagesEndRef = useRef(null);

      const suggestions = ["Como melhorar a qualidade do meu solo?", "Quanto custa instalar energia solar na fazenda?", "O que é o Pronaf Eco e como solicitar?", "Como calcular a necessidade de calcário?", "Quais culturas são mais lucrativas agora?", "Como fazer análise de solo corretamente?", "O que é CAR e como regularizar?", "Minha vaca está com febre, o que fazer?"];

      useEffect(() => { messagesEndRef.current?.scrollIntoView({ behavior: "smooth" }); }, [messages]);

      const sendMessage = async (text) => {
        const msg = text || input.trim();
        if (!msg || loading) return;
        setInput("");
        const userMsg = { role: "user", content: msg };
        setMessages(prev => [...prev, userMsg]);
        setLoading(true);
        try {
          let contextMsg = msg;
          if (farmData?.name) contextMsg = `[Contexto da fazenda: ${farmData.name}, ${farmData.hectares || "?"} ha, ${farmData.type || ""}, ${farmData.state || ""}, culturas: ${farmData.crops || "não informado"}, pecuária: ${farmData.livestock || "não informado"}]\n\n${msg}`;
          const apiMessages = [...messages.filter((m, i) => i > 0), { role: "user", content: contextMsg }];
          const reply = await askAgroBot(apiMessages.map(m => ({ role: m.role, content: m.content })));
          setMessages(prev => [...prev, { role: "assistant", content: reply }]);
        } catch (e) {
          setMessages(prev => [...prev, { role: "assistant", content: "⚠️ Desculpe, ocorreu um erro. Verifique sua conexão e tente novamente." }]);
        }
        setLoading(false);
      };

      const formatMsg = (content) => content.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>').replace(/\*(.*?)\*/g, '<em>$1</em>').replace(/\n/g, '<br/>');

      return (
        <div className="fade-in" style={{ height: "calc(100vh - 120px)", display: "flex", flexDirection: "column" }}>
          <div style={{ marginBottom: 20 }}>
            <h2 style={{ fontFamily: "'Playfair Display', serif", fontSize: 28, fontWeight: 700, color: "var(--green-deep)" }}>🤖 AgroBot — Assistente IA</h2>
            <p style={{ color: "var(--text-light)", marginTop: 6 }}>Tire suas dúvidas sobre agricultura, pecuária e sustentabilidade</p>
          </div>
          <div style={{ display: "flex", gap: 20, flex: 1, minHeight: 0 }}>
            <div style={{ flex: 1, display: "flex", flexDirection: "column", background: "#fff", borderRadius: "var(--radius)", boxShadow: "var(--shadow)", overflow: "hidden" }}>
              <div style={{ background: "linear-gradient(135deg, var(--green-deep), var(--green-mid))", padding: "16px 20px", display: "flex", alignItems: "center", gap: 12 }}>
                <div style={{ width: 44, height: 44, borderRadius: "50%", background: "rgba(255,255,255,0.15)", display: "flex", alignItems: "center", justifyContent: "center", fontSize: 22 }}>🌱</div>
                <div>
                  <div style={{ color: "#fff", fontWeight: 700, fontSize: 15 }}>AgroBot</div>
                  <div style={{ display: "flex", alignItems: "center", gap: 6 }}>
                    <div style={{ width: 8, height: 8, borderRadius: "50%", background: loading ? "var(--gold)" : "#69db7c", animation: loading ? "pulse 1s infinite" : "none" }} />
                    <span style={{ color: "rgba(255,255,255,0.7)", fontSize: 12 }}>{loading ? "Processando..." : "Online"}</span>
                  </div>
                </div>
              </div>
              <div style={{ flex: 1, overflowY: "auto", padding: "20px", display: "flex", flexDirection: "column", gap: 16 }}>
                {messages.map((m, i) => (
                  <div key={i} style={{ display: "flex", justifyContent: m.role === "user" ? "flex-end" : "flex-start", gap: 10, alignItems: "flex-end" }}>
                    {m.role === "assistant" && <div style={{ width: 32, height: 32, borderRadius: "50%", background: "linear-gradient(135deg, var(--green-mid), var(--green-light))", display: "flex", alignItems: "center", justifyContent: "center", fontSize: 16, flexShrink: 0 }}>🌱</div>}
                    <div style={{ maxWidth: "75%", padding: "12px 16px", borderRadius: m.role === "user" ? "18px 18px 4px 18px" : "18px 18px 18px 4px", background: m.role === "user" ? "linear-gradient(135deg, var(--green-mid), var(--green-deep))" : "var(--cream)", color: m.role === "user" ? "#fff" : "var(--text-dark)", fontSize: 14, lineHeight: 1.6, boxShadow: "0 2px 8px rgba(0,0,0,0.08)", border: m.role === "assistant" ? "1px solid var(--cream-dark)" : "none" }}>
                      <span dangerouslySetInnerHTML={{ __html: formatMsg(m.content) }} />
                    </div>
                    {m.role === "user" && <div style={{ width: 32, height: 32, borderRadius: "50%", background: "var(--gold)", display: "flex", alignItems: "center", justifyContent: "center", fontSize: 16, flexShrink: 0 }}>🧑‍🌾</div>}
                  </div>
                ))}
                {loading && (
                  <div style={{ display: "flex", gap: 10, alignItems: "flex-end" }}>
                    <div style={{ width: 32, height: 32, borderRadius: "50%", background: "linear-gradient(135deg, var(--green-mid), var(--green-light))", display: "flex", alignItems: "center", justifyContent: "center", fontSize: 16 }}>🌱</div>
                    <div style={{ background: "var(--cream)", border: "1px solid var(--cream-dark)", padding: "14px 18px", borderRadius: "18px 18px 18px 4px", display: "flex", gap: 5, alignItems: "center" }}>
                      {[0, 1, 2].map(i => <div key={i} style={{ width: 8, height: 8, borderRadius: "50%", background: "var(--green-mid)", animation: "pulse 1.2s infinite", animationDelay: `${i * 0.2}s` }} />)}
                    </div>
                  </div>
                )}
                <div ref={messagesEndRef} />
              </div>
              <div style={{ padding: "16px 20px", borderTop: "1px solid var(--cream-dark)", background: "#fff" }}>
                <div style={{ display: "flex", gap: 10, alignItems: "flex-end" }}>
                  <textarea value={input} onChange={e => setInput(e.target.value)} onKeyDown={e => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); sendMessage(); } }} placeholder="Pergunte sobre sua fazenda... (Enter para enviar)" rows={2}
                    style={{ flex: 1, padding: "12px 16px", border: "2px solid var(--cream-dark)", borderRadius: 12, fontSize: 14, resize: "none", background: "var(--cream)", color: "var(--text-dark)", lineHeight: 1.5 }}
                    onFocus={e => e.target.style.borderColor = "var(--green-light)"}
                    onBlur={e => e.target.style.borderColor = "var(--cream-dark)"} />
                  <button onClick={() => sendMessage()} disabled={!input.trim() || loading}
                    style={{ width: 48, height: 48, borderRadius: 12, background: input.trim() && !loading ? "linear-gradient(135deg, var(--green-mid), var(--green-deep))" : "var(--cream-dark)", display: "flex", alignItems: "center", justifyContent: "center", cursor: input.trim() && !loading ? "pointer" : "default", transition: "all 0.2s", flexShrink: 0, border: "none" }}>
                    <Icon name="send" size={20} color={input.trim() && !loading ? "#fff" : "var(--text-light)"} />
                  </button>
                </div>
              </div>
            </div>
            <div style={{ width: 220, flexShrink: 0 }}>
              <Card style={{ padding: 16 }}>
                <h4 style={{ fontSize: 13, fontWeight: 700, color: "var(--green-deep)", marginBottom: 12 }}>💡 Perguntas sugeridas</h4>
                {suggestions.map((s, i) => (
                  <div key={i} onClick={() => sendMessage(s)} style={{ padding: "10px 12px", borderRadius: 10, marginBottom: 8, cursor: "pointer", background: "var(--cream)", border: "1px solid var(--cream-dark)", fontSize: 12, color: "var(--text-mid)", lineHeight: 1.4, transition: "all 0.2s" }}
                    onMouseEnter={e => { e.currentTarget.style.background = "var(--green-pale)"; e.currentTarget.style.borderColor = "var(--green-light)"; }}
                    onMouseLeave={e => { e.currentTarget.style.background = "var(--cream)"; e.currentTarget.style.borderColor = "var(--cream-dark)"; }}>
                    {s}
                  </div>
                ))}
              </Card>
            </div>
          </div>
        </div>
      );
    };

    const FornecedoresPage = ({ farmData }) => {
      const [location, setLocation] = useState(farmData?.city ? `${farmData.city}, ${farmData.state}` : "");
      const [type, setType] = useState("energia solar");
      const [result, setResult] = useState("");
      const [loading, setLoading] = useState(false);
      const [searched, setSearched] = useState(false);

      const types = [
        { value: "energia solar", label: "☀️ Energia Solar Fotovoltaica" }, { value: "biodigestores e biogás", label: "♻️ Biodigestores e Biogás" },
        { value: "irrigação eficiente", label: "💧 Irrigação Eficiente" }, { value: "energia eólica rural", label: "🌬️ Energia Eólica Rural" },
        { value: "compostagem e resíduos", label: "🌱 Compostagem e Resíduos" }, { value: "reflorestamento e mudas", label: "🌳 Reflorestamento e Mudas" },
        { value: "consultoria ambiental", label: "📋 Consultoria Ambiental e CAR" }, { value: "crédito de carbono", label: "🌍 Crédito de Carbono" },
      ];

      const handleSearch = async () => {
        if (!location.trim()) return;
        setLoading(true); setSearched(true);
        const res = await searchSustainableProviders(location, type);
        setResult(res);
        setLoading(false);
      };

      const formatResult = (text) => text.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>').replace(/\*(.*?)\*/g, '<em>$1</em>').replace(/\n\n/g, '</p><p>').replace(/\n/g, '<br/>');

      return (
        <div className="fade-in">
          <div style={{ marginBottom: 28 }}>
            <h2 style={{ fontFamily: "'Playfair Display', serif", fontSize: 28, fontWeight: 700, color: "var(--green-deep)" }}>📍 Fornecedores & Parceiros</h2>
            <p style={{ color: "var(--text-light)", marginTop: 6 }}>Encontre fornecedores de soluções sustentáveis na sua região</p>
          </div>
          <Card style={{ marginBottom: 20, background: "linear-gradient(135deg, #e8f5e9, #f1f8e9)", border: "1px solid var(--green-pale)" }}>
            <h3 style={{ fontFamily: "'Playfair Display', serif", fontSize: 18, fontWeight: 700, color: "var(--green-deep)", marginBottom: 20 }}>🔍 Buscar por região</h3>
            <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr auto", gap: 12, alignItems: "flex-end" }}>
              <div>
                <label style={{ display: "block", fontWeight: 600, fontSize: 13, color: "var(--text-mid)", marginBottom: 6 }}>Sua localização</label>
                <input value={location} onChange={e => setLocation(e.target.value)} placeholder="Ex: Sorriso, MT ou Triângulo Mineiro, MG"
                  style={{ width: "100%", padding: "13px 16px", border: "2px solid var(--cream-dark)", borderRadius: 10, fontSize: 15, background: "#fff" }}
                  onFocus={e => e.target.style.borderColor = "var(--green-light)"}
                  onBlur={e => e.target.style.borderColor = "var(--cream-dark)"} />
              </div>
              <div>
                <label style={{ display: "block", fontWeight: 600, fontSize: 13, color: "var(--text-mid)", marginBottom: 6 }}>Tipo de serviço</label>
                <select value={type} onChange={e => setType(e.target.value)}
                  style={{ width: "100%", padding: "13px 16px", border: "2px solid var(--cream-dark)", borderRadius: 10, fontSize: 14, background: "#fff", cursor: "pointer" }}
                  onFocus={e => e.target.style.borderColor = "var(--green-light)"}
                  onBlur={e => e.target.style.borderColor = "var(--cream-dark)"}>
                  {types.map(t => <option key={t.value} value={t.value}>{t.label}</option>)}
                </select>
              </div>
              <Btn onClick={handleSearch} disabled={!location.trim() || loading} size="md" style={{ height: 50 }}>
                <Icon name="search" size={18} color="#fff" /> {loading ? "Buscando..." : "Buscar"}
              </Btn>
            </div>
          </Card>
          <div style={{ display: "flex", flexWrap: "wrap", gap: 8, marginBottom: 20 }}>
            {types.map(t => <div key={t.value} onClick={() => setType(t.value)} style={{ padding: "8px 14px", borderRadius: 20, fontSize: 13, cursor: "pointer", background: type === t.value ? "var(--green-mid)" : "#fff", color: type === t.value ? "#fff" : "var(--text-mid)", border: `1px solid ${type === t.value ? "var(--green-mid)" : "var(--cream-dark)"}`, fontWeight: type === t.value ? 600 : 400, transition: "all 0.2s" }}>{t.label}</div>)}
          </div>
          {loading && <Card style={{ padding: 40, textAlign: "center" }}><div style={{ fontSize: 40, animation: "spin 2s linear infinite", display: "inline-block" }}>🌱</div><p style={{ color: "var(--text-light)", marginTop: 16, fontSize: 15 }}>Buscando fornecedores e programas disponíveis na sua região...</p></Card>}
          {searched && !loading && result && (
            <Card className="fade-in">
              <div style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 20, paddingBottom: 16, borderBottom: "2px solid var(--cream-dark)" }}>
                <Icon name="mapPin" size={20} color="var(--green-mid)" />
                <div>
                  <h3 style={{ fontFamily: "'Playfair Display', serif", fontSize: 18, fontWeight: 700, color: "var(--green-deep)" }}>Resultados para: {location}</h3>
                  <p style={{ fontSize: 13, color: "var(--text-light)" }}>{types.find(t => t.value === type)?.label}</p>
                </div>
              </div>
              <div style={{ fontSize: 14, color: "var(--text-mid)", lineHeight: 1.8 }} dangerouslySetInnerHTML={{ __html: `<p>${formatResult(result)}</p>` }} />
              <div style={{ marginTop: 20, paddingTop: 16, borderTop: "1px solid var(--cream-dark)", display: "flex", gap: 12 }}>
                <Btn onClick={handleSearch} variant="ghost" size="sm"><Icon name="recycle" size={16} color="var(--green-mid)" /> Atualizar busca</Btn>
                <Btn onClick={() => setResult("")} variant="ghost" size="sm"><Icon name="close" size={16} color="var(--text-light)" /> Limpar</Btn>
              </div>
            </Card>
          )}
          {!searched && (
            <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fill, minmax(280px, 1fr))", gap: 16 }}>
              {[{ emoji: "☀️", title: "Energia Solar no Campo", desc: "Sistemas fotovoltaicos isolados (off-grid) ou conectados à rede para propriedades rurais. Financiamentos disponíveis com Pronaf Eco.", tag: "energia solar" }, { emoji: "💧", title: "Irrigação Eficiente", desc: "Sistemas de gotejamento, microaspersão e pivot central com economia de até 50% de água comparado à irrigação convencional.", tag: "irrigação eficiente" }, { emoji: "♻️", title: "Biodigestores", desc: "Transforme resíduos do confinamento em energia e biofertilizante. Projetos financiados pelo Pronaf Bioeconomia.", tag: "biodigestores e biogás" }, { emoji: "🌳", title: "Reflorestamento", desc: "Mudas nativas, certificação e apoio técnico para recuperação de APPs e Reserva Legal com geração de crédito de carbono.", tag: "reflorestamento e mudas" }].map(c => (
                <Card key={c.title} style={{ cursor: "pointer", transition: "all 0.2s" }} onClick={() => { setType(c.tag); setTimeout(handleSearch, 0); }}>
                  <div style={{ fontSize: 32, marginBottom: 12 }}>{c.emoji}</div>
                  <h4 style={{ fontFamily: "'Playfair Display', serif", fontWeight: 700, color: "var(--green-deep)", marginBottom: 8 }}>{c.title}</h4>
                  <p style={{ fontSize: 13, color: "var(--text-light)", lineHeight: 1.6, marginBottom: 12 }}>{c.desc}</p>
                  <span style={{ fontSize: 12, fontWeight: 600, color: "var(--green-mid)" }}>Buscar fornecedores →</span>
                </Card>
              ))}
            </div>
          )}
        </div>
      );
    };

    function App() {
      const [page, setPage] = useState("login");
      const [user, setUser] = useState(null);
      const [activeNav, setActiveNav] = useState("home");
      const [sidebarCollapsed, setSidebarCollapsed] = useState(false);
      const [farmData, setFarmData] = useState(null);
      const [sustData, setSustData] = useState(null);
      const [soilData, setSoilData] = useState(null);
      const [energyData, setEnergyData] = useState(null);

      const handleLogin = (u) => { setUser(u); setPage("app"); };
      const handleLogout = () => { setUser(null); setPage("login"); setActiveNav("home"); };
      const handleSaveFarm = (data) => { setFarmData(data); };
      const handleSaveSust = (data) => { setSustData(data); };

      if (page === "login") return <LoginPage onLogin={handleLogin} onRegister={() => setPage("register")} />;
      if (page === "register") return <RegisterPage onBack={() => setPage("login")} onSuccess={handleLogin} />;

      return (
        <div style={{ display: "flex", minHeight: "100vh", background: "var(--cream)" }}>
          <Sidebar active={activeNav} onNavigate={setActiveNav} user={user} onLogout={handleLogout} collapsed={sidebarCollapsed} onToggle={() => setSidebarCollapsed(c => !c)} />
          <main style={{ flex: 1, overflow: "auto", padding: "32px 36px", minWidth: 0 }}>
            {activeNav === "home" && <HomePage user={user} farmData={{ ...farmData, ecoLevel: sustData?.ecoScore, waterScore: soilData?.waterQuality === "Excelente" ? 9.5 : soilData?.waterQuality === "Boa" ? 7.8 : farmData?.waterScore, solarKwh: energyData?.solarMonthlyGen || farmData?.solarKwh }} onNavigate={setActiveNav} />}
            {activeNav === "fazenda" && <FazendaPage farmData={farmData} onSave={handleSaveFarm} />}
            {activeNav === "sustentabilidade" && <SustentabilidadePage sustData={sustData} onSave={handleSaveSust} />}
            {activeNav === "solo" && <SoloAguaPage soilData={soilData} onSave={setSoilData} />}
            {activeNav === "energia" && <EnergiaPage energyData={energyData} onSave={setEnergyData} />}
            {activeNav === "ia" && <IAPage farmData={farmData} sustData={sustData} />}
            {activeNav === "fornecedores" && <FornecedoresPage farmData={farmData} />}
          </main>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
